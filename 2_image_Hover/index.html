<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Image Hover Interaction</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap" rel="stylesheet">
</head>

<body>
  <div class="wireframe">
    <div class="container" id="interaction-container">

      <div class="content-row">

        <div class="nav-item">
          <div class="hover-popup">
            <img src="growth.png" alt="Growth">
          </div>
          <div class="icon-wrapper">
            <img src="icon.svg" class="nav-icon icon-default" alt="icon">
            <img src="growth.svg" class="nav-icon icon-hover" alt="icon">
          </div>
          <p>Growth</p>
        </div>

        <div class="nav-item">
          <div class="hover-popup">
            <img src="fun.png" alt="Fun">
          </div>
          <div class="icon-wrapper">
            <img src="icon.svg" class="nav-icon icon-default" alt="icon">
            <img src="fun.svg" class="nav-icon icon-hover" alt="icon">
          </div>
          <p>Fun</p>
        </div>

        <div class="nav-item">
          <div class="hover-popup">
            <img src="fitness.png" alt="Fitness">
          </div>
          <div class="icon-wrapper">
            <img src="icon.svg" class="nav-icon icon-default" alt="icon">
            <img src="fitness.svg" class="nav-icon icon-hover" alt="icon">
          </div>
          <p>Fitness</p>
        </div>

        <div class="nav-item">
          <div class="hover-popup">
            <img src="community.png" alt="Community">
          </div>
          <div class="icon-wrapper">
            <img src="icon.svg" class="nav-icon icon-default" alt="icon">
            <img src="community.svg" class="nav-icon icon-hover" alt="icon">
          </div>
          <p>Community</p>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
