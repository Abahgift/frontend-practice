<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eko Runners Club</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Geist:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="image-gallery">
      <div class="img-wrapper img-1">
        <img src="assets/img1.png" alt="Participant 1">
      </div>
      <div class="img-wrapper img-2">
        <img src="assets/img2.png" alt="Participant 2">
      </div>
      <div class="img-wrapper img-4">
        <img src="assets/img4.png" alt="Participant 3">
      </div>
      <div class="img-wrapper img-3">
        <img src="assets/img3.png" alt="Participant 4">
      </div>
    </div>
    
    <div class="content">
      <h1>Join a community of<br>health enthusiasts</h1>
      <p class="subtitle">The eko runners clubs is where to be to hit<br>your fitness goal and meet great people</p>
      
      <div class="cta-container">
        <button class="join-btn">Join Now</button>
        <p class="terms">Ts and Cs apply</p>
      </div>
    </div>
  </div>
</body>
</html>
